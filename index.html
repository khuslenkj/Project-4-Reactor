<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IronMan Reactor</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="center"></div>
    <div style="--size: 105px; --border: #165274 dashed 10px; --animation: spinright 10s linear infinite;" class="toirog"></div>
    <div style="--size: 150px; --border: #3c9bd2 dashed 20px; --animation: spinleft 10s linear infinite;" class="toirog"></div>
    <div style="--size: 195px; --border: #3c9bd2 solid 2px; --animation: spinleft 10s linear infinite;" class="toirog"></div>
    <div style="--size: 250px; --border: #165274 dashed 40px; --animation: spinright 10s linear infinite;" class="toirog"></div>
    <div style="--size: 350px; --border: #60b6e3 solid 5px; --animation: spinright 10s linear infinite;" class="toirog"></div>
</body>
</html>
